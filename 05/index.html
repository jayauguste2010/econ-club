:root {
  --ink: #141414; --ink2: #6F6F7A; --ink3: #A3A3AE; --card: #F3F3F6; --line: #E2E2EA;
  --mag: #D54CA9; --hl: #D2409A; --o: #F6A03C; --c: #F2606F; --p: #9B52EF;
  --grad: linear-gradient(90deg, #FFB84D 0%, #F85C7A 50%, #A54AF5 100%);
  --up: #1F9D55; --down: #D9364F;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: #fff; color: var(--ink); font-family: 'PB', "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", system-ui, -apple-system, sans-serif; font-size: 15px; line-height: 1.55; }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.bar { height: 6px; background: var(--grad); }
.wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px 110px; }
.eyebrow { font-size: 11px; letter-spacing: .2em; color: var(--ink3); font-weight: 600; text-transform: uppercase; }
h1 { font-size: 28px; line-height: 1.25; font-weight: 800; margin-top: 6px; }
h1 small { display: block; font-size: 13px; letter-spacing: .14em; color: #EE8A3C; font-weight: 700; margin-top: 4px; }
h2 { font-size: 18px; font-weight: 800; line-height: 1.35; }
p { color: #2A2A30; }
.muted { color: var(--ink2); font-size: 13px; }
.card { background: var(--card); border-radius: 18px; padding: 14px 14px; margin-top: 12px; }
.card.white { background: #fff; border: 2px solid var(--line); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 999px; padding: 11px 18px; min-height: 44px; font-weight: 700; font-size: 15px; background: var(--ink); color: #fff; }
.btn.alt { background: #fff; color: var(--ink); border: 2px solid var(--line); }
.btn.ghost { background: transparent; color: var(--ink2); padding: 11px 8px; }
.btn.grad { background: var(--grad); }
.btn:disabled { opacity: .35; }
.btn.block { width: 100%; }
.btn:active:not(:disabled) { transform: scale(.97); }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.icons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.icons .it { display: flex; flex-direction: column; align-items: center; width: 62px; font-size: 11px; color: var(--ink2); text-align: center; line-height: 1.3; }
.icons img { width: 44px; height: 44px; }
.icons .it.hid { color: var(--hl); font-weight: 700; }
.rules li { margin: 6px 0 0 18px; font-size: 14px; color: #2A2A30; }
.rules li b { color: var(--ink); }
/* header during the game */
.top { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-bottom: 1px solid #EFEFF3; }
.top .in { max-width: 480px; margin: 0 auto; padding: 10px 16px 9px; }
.top .l1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.top .wk { font-size: 17px; font-weight: 800; }
.top .wk small { font-size: 12px; color: var(--ink3); font-weight: 600; margin-left: 4px; }
.top .help { border: 0; background: var(--card); border-radius: 999px; font-size: 12px; font-weight: 700; padding: 5px 11px; color: var(--ink2); }
.prog { display: flex; gap: 3px; margin-top: 7px; }
.prog i { flex: 1; height: 4px; border-radius: 2px; background: #E7E7ED; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
.stat { background: var(--card); border-radius: 12px; padding: 6px 8px; }
.stat .k { font-size: 11px; color: var(--ink2); }
.stat .v { font-size: 15px; font-weight: 700; white-space: nowrap; }
.news { display: flex; gap: 10px; align-items: center; background: #FFF6EC; border-radius: 16px; padding: 10px 12px; margin-top: 12px; }
.news img { width: 34px; height: 34px; flex: none; }
.news .t { font-size: 14.5px; font-weight: 700; line-height: 1.45; }
.news .t small { display: block; font-size: 11px; color: #C27A2C; font-weight: 700; letter-spacing: .08em; }
.notice { background: #F1ECFF; color: #4B2A8C; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; margin-top: 10px; }
.sec { display: flex; align-items: baseline; justify-content: space-between; margin-top: 18px; }
.sec h3 { font-size: 15px; font-weight: 800; }
.sec span { font-size: 12px; color: var(--ink2); }
.plist { margin-top: 6px; }
.prow { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #F0F0F4; }
.prow img { width: 38px; height: 38px; }
.prow .nm { font-size: 14px; font-weight: 700; line-height: 1.3; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 0 7px; margin-left: 4px; vertical-align: 1px; }
.tag.hot { background: #FFE9D6; color: #B4610F; }
.tag.hid { background: #FBE3F1; color: #B3287A; }
.prow .pr { font-size: 13px; color: var(--ink2); margin-top: 1px; white-space: nowrap; }
.prow .pr b { color: var(--ink); font-size: 14.5px; }
.chg { font-size: 11.5px; font-weight: 700; margin-left: 4px; }
.chg.up { color: var(--up); }
.chg.down { color: var(--down); }
.prow .act { display: flex; align-items: center; gap: 6px; }
.prow .q { min-width: 30px; text-align: right; font-size: 14px; font-weight: 700; }
.prow .q.zero { color: var(--ink3); font-weight: 500; }
.sbtn { border: 2px solid var(--line); background: #fff; border-radius: 10px; font-size: 12.5px; font-weight: 700; padding: 6px 8px; min-height: 36px; color: var(--ink); }
.sbtn:disabled { opacity: .3; }
.buyrow { background: var(--card); border-radius: 16px; padding: 12px; margin-top: 10px; }
.buyrow .h { display: flex; align-items: center; gap: 10px; }
.buyrow .h img { width: 36px; height: 36px; }
.buyrow .bt { font-size: 14.5px; font-weight: 800; line-height: 1.35; }
.buyrow .bs { font-size: 12px; color: var(--ink2); line-height: 1.45; margin-top: 1px; }
.buyrow .ctl { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.step { display: flex; align-items: center; background: #fff; border: 2px solid var(--line); border-radius: 12px; }
.step button { border: 0; background: transparent; width: 38px; height: 38px; font-size: 20px; font-weight: 700; color: var(--ink); }
.step input { width: 46px; border: 0; text-align: center; font: inherit; font-weight: 700; font-size: 16px; background: transparent; -moz-appearance: textfield; }
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.buyrow .cost { font-size: 12px; color: var(--ink2); margin-left: auto; text-align: right; line-height: 1.3; }
.buyrow .cost b { display: block; font-size: 14px; color: var(--ink); }
.buyrow .go { margin-top: 10px; }
.buyrow.off { opacity: .55; }
.pend { font-size: 12.5px; color: #4B2A8C; margin-top: 8px; }
.chartbox { margin-top: 8px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink2); margin-top: 4px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2.4px solid var(--mag); vertical-align: middle; margin-right: 4px; }
.legend i.d { border-top: 1.6px dashed var(--ink2); }
.foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(255,255,255,.97); border-top: 1px solid #EFEFF3; padding-bottom: env(safe-area-inset-bottom); }
.foot .in { max-width: 480px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; }
.foot .btn { flex: 1; }
/* modal */
.mask { position: fixed; inset: 0; background: rgba(20,20,20,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 86vh; overflow: auto; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
.sheet h2 { font-size: 18px; }
.got { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.got .g { background: var(--card); border-radius: 14px; padding: 8px 4px 6px; text-align: center; font-size: 11.5px; color: var(--ink2); }
.got .g img { width: 40px; height: 40px; display: block; margin: 0 auto 2px; }
.got .g b { display: block; font-size: 15px; color: var(--ink); }
.got .g.h { background: #FBE3F1; color: #B3287A; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 999px; z-index: 30; max-width: 90vw; text-align: center; animation: fade 2.2s ease forwards; }
@keyframes fade { 0% { opacity: 0; transform: translate(-50%, 8px); } 10% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
/* warm-up grid */
.tiles { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-top: 12px; }
.tiles i { display: block; aspect-ratio: 1 / 1; border-radius: 5px; background: #E7E7ED; transition: background .2s; }
.tiles i.on { background: #CFCFDA; }
.tiles i.h { background: var(--grad); box-shadow: 0 0 0 2px #fff, 0 0 0 4px #F85C7A; }
.guess { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.guess button { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 0; font-weight: 800; font-size: 16px; }
.guess button.sel { border-color: var(--ink); background: var(--ink); color: #fff; }
/* result */
.big { font-size: 40px; font-weight: 800; line-height: 1.1; margin-top: 6px; }
.big.up { color: var(--up); }
.big.down { color: var(--down); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid #ECECF1; font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv b { white-space: nowrap; }
.bench { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #ECECF1; font-size: 13.5px; }
.bench:last-child { border-bottom: 0; }
.bench .n { width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.bench .r { font-weight: 800; white-space: nowrap; }
.pos { color: var(--up); }
.neg { color: var(--down); }
svg text { font-family: 'PB', "PingFang SC", "Noto Sans CJK SC", sans-serif; }
.hidden { display: none !important; }
</style>

  function fmt(v) {

  function screenWarm() {

    G.warm = { guess: null, got: null, done: false };

    $('tiles').innerHTML = tiles;
    Array.prototype.forEach.call($('guess').querySelectorAll('button'), function (b) {
      b.onclick = function () {
        G.warm.guess = +b.getAttribute('data-g');

  function weekTop() {
    var w = G.week, iv = invValue(w), pv = preValue();
    var prog = ''; for (var i = 0; i <= LAST; i++) prog += '<i style="background:' + (i <= w ? gradAt(i / LAST) : '#E7E7ED') + '"></i>';
    setTop('<div class="top"><div class="in"><div class="l1"><div class="wk">' + (w === 0 ? '发售日' : '第 ' + w + ' 周') + '<small>' + (w === 0 ? '第 0 周 / 10' : '/ 10') + '</small></div>' +
      '<button class="help" id="help">规则</button></div><div class="prog">' + prog + '</div>' +
      '<div class="stats"><div class="stat"><div class="k">现金</div><div class="v">' + fmt(G.cash) + '</div></div>' +
      '<div class="stat"><div class="k">货值' + (pv ? '+预售' : '') + '</div><div class="v">' + fmt(iv + pv) + '</div></div>' +
      '<div class="stat"><div class="k">合计</div><div class="v">' + fmt(G.cash + iv + pv) + '</div></div></div></div></div>');
    $('help').onclick = showRules;
  }
  function gradAt(t) {
    var st = [[0, [255, 184, 77]], [0.5, [248, 92, 122]], [1, [165, 74, 245]]];
    for (var i = 0; i < st.length - 1; i++) {
      var a = st[i], b = st[i + 1];
      if (t <= b[0]) { var u = (t - a[0]) / (b[0] - a[0]); return 'rgb(' + a[1].map(function (c, j) { return Math.round(c + (b[1][j] - c) * u); }).join(',') + ')'; }
    }
    return 'rgb(165,74,245)';
  }

  function officialState() {
    var w = G.week, S = G.S;
    if (w === 0) return { kind: 'w0', left: W0_LIMIT - G.offW0 };
    if (w < S.restock) return { kind: 'soldout' };
    if (w + PRE_DELAY <= LAST) return { kind: 'pre', left: PRE_LIMIT - G.preThis, arrive: w + PRE_DELAY };
    return { kind: 'late' };
  }

  function screenWeek() {
    var w = G.week, S = G.S;
    weekTop();
    var x = S.weeks[w], prev = w > 0 ? S.weeks[w - 1] : null;
    var rows = DESIGNS.map(function (d) {
      var pr = priceOf(S, w, d), q = G.inv[d.id], chg = '';
      if (prev) {
        var pp = priceOf(S, w - 1, d), r = pr / pp - 1;
        if (Math.abs(r) >= 0.005) chg = '<span class="chg ' + (r > 0 ? 'up' : 'down') + '">' + (r > 0 ? '▲' : '▼') + ' ' + Math.abs(Math.round(r * 100)) + '%</span>';
      }
      var tag = d.tier === 'p' ? '<span class="tag hot">热门</span>' : d.tier === 'h' ? '<span class="tag hid">隐藏</span>' : '';
      return '<div class="prow"><img src="' + ICON[d.id] + '" alt=""><div><div class="nm">' + d.name + tag + '</div>' +
        '<div class="pr"><b>' + fmt(pr) + '</b>' + chg + '</div></div>' +
        '<div class="act"><span class="q' + (q ? '' : ' zero') + '">×' + q + '</span>' +
        '<button class="sbtn" data-s1="' + d.id + '"' + (q ? '' : ' disabled') + '>卖 1</button>' +
        '<button class="sbtn" data-sa="' + d.id + '"' + (q ? '' : ' disabled') + '>全卖</button></div></div>';
    }).join('');
    var bp = boxPrice(S, w), os = officialState();
    var off;
    if (os.kind === 'w0' && os.left <= 0) off = '<div class="buyrow off"><div class="h"><img src="' + ICON.box + '" alt=""><div><div class="bt">官方 · 已买满 12 个</div><div class="bs">发售日每人限购 12 个，想再买只能去二手平台。</div></div></div></div>';
    else if (os.kind === 'w0') off = buyBlock('off', '官方 · 99 元', '发售日每人限购 12 个，你还能买 ' + os.left + ' 个。', os.left, OFFICIAL, '按原价买并开盒', os.left > 0);
    else if (os.kind === 'pre') off = buyBlock('off', '官方补货预售 · 99 元', '现在下单，第 ' + os.arrive + ' 周到货（到货时自动开盒）。这周还能订 ' + os.left + ' 个。', os.left, OFFICIAL, '预售下单', os.left > 0);
    else if (os.kind === 'soldout') off = '<div class="buyrow off"><div class="h"><img src="' + ICON.box + '" alt=""><div><div class="bt">官方 · 已售罄</div><div class="bs">官方暂时没有货，只能去二手平台买。</div></div></div></div>';
    else off = '<div class="buyrow off"><div class="h"><img src="' + ICON.box + '" alt=""><div><div class="bt">官方预售 · 来不及了</div><div class="bs">现在下单要 3 周后到货，赶不上第 10 周结算。</div></div></div></div>';
    var sec = buyBlock('sec', '二手平台 · 未拆盲盒 ' + fmt(bp), '按“平均能开出多少钱”定价：71/72 × 常规款均价 + 1/72 × 隐藏款价。', Math.floor(G.cash / bp), bp, '买下并开盒', true);
    var pend = G.pre.length ? '<div class="pend">预售中：' + G.pre.map(function (p) { return p.qty + ' 个（第 ' + p.arrive + ' 周到货）'; }).join('，') + '</div>' : '';
    var holding = DESIGNS.some(function (d) { return G.inv[d.id] > 0; });
    var priceSec = '<div class="sec"><h3>二手平台价格</h3><span>卖出到手 = 价格 × 95%</span></div><div class="plist">' + rows + '</div>';
    var buySec = '<div class="sec"><h3>买盲盒</h3><span>现金 ' + fmt(G.cash) + '</span></div>' + off + pend + sec;
    var arr = G.arrivals ? '<div class="notice">预售到货 ' + G.arrivals + ' 个，已经帮你开盒，放进库存了。</div>' : '';
    $('app').innerHTML =
      '<div class="news"><img src="' + ICON.news + '" alt=""><div class="t"><small>这周的新闻</small>' + esc(x.news) + '</div></div>' + arr +
      (holding ? priceSec + buySec : buySec + priceSec) +
      '<div class="sec"><h3>未拆盲盒的价格走势</h3><span>到第 ' + w + ' 周</span></div><div class="chartbox">' + lineChart(w, null) + '</div>' +
      '<div class="legend"><span><i></i>未拆盲盒（二手）</span><span><i class="d"></i>官方价 99 元</span></div>';
    setFoot('<div class="foot"><div class="in"><button class="btn alt" id="sellAll">全部卖掉</button><button class="btn grad" id="next">' + (w < LAST ? '下一周 →' : '结算 →') + '</button></div></div>');
    bindWeek();
  }

  function buyBlock(key, title, sub, max, unit, label, enabled) {
    max = Math.max(0, max);
    var start = Math.min(max, key === 'off' && G.week === 0 ? max : 1);
    return '<div class="buyrow' + (enabled && max > 0 ? '' : ' off') + '" data-key="' + key + '" data-max="' + max + '" data-unit="' + unit + '">' +
      '<div class="h"><img src="' + ICON.box + '" alt=""><div><div class="bt">' + title + '</div><div class="bs">' + sub + '</div></div></div>' +
      '<div class="ctl"><div class="step"><button data-d="-1">−</button><input type="number" inputmode="numeric" min="0" max="' + max + '" value="' + start + '"><button data-d="1">+</button></div>' +
      '<button class="sbtn" data-max="1">最多</button><div class="cost">合计<b>' + fmt(start * unit) + '</b></div></div>' +
      '<button class="btn block go" ' + (enabled && max > 0 ? '' : 'disabled') + '>' + label + '</button></div>';
  }

  function bindWeek() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-s1]'), function (b) { b.onclick = function () { sell(b.getAttribute('data-s1'), 1); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-sa]'), function (b) { b.onclick = function () { var id = b.getAttribute('data-sa'); sell(id, G.inv[id]); }; });
    Array.prototype.forEach.call(document.querySelectorAll('.buyrow[data-key]'), function (row) {
      var inp = row.querySelector('input'), max = +row.getAttribute('data-max'), unit = +row.getAttribute('data-unit');
      var costEl = row.querySelector('.cost b'), go = row.querySelector('.go');
      function clamp() {
        var v = Math.floor(+inp.value || 0);
        var cashMax = Math.floor(G.cash / unit);
        var m = Math.min(max, cashMax);
        v = Math.max(0, Math.min(m, v)); inp.value = v; costEl.textContent = fmt(v * unit);
        go.disabled = v <= 0;
      }
      if (!inp) return;
      Array.prototype.forEach.call(row.querySelectorAll('.step button'), function (b) {
        b.onclick = function () { inp.value = (+inp.value || 0) + (+b.getAttribute('data-d')); clamp(); };
      });
      row.querySelector('[data-max]').onclick = function () { inp.value = max; clamp(); };
      inp.oninput = clamp; inp.onchange = clamp;
      clamp();
      go.onclick = function () {
        var k = +inp.value; if (k <= 0) return;
        var key = row.getAttribute('data-key');
        if (key === 'sec') buySecondary(k); else if (G.week === 0) buyOfficialW0(k); else preorder(k);
      };
    });
    $('sellAll').onclick = sellAll;
    $('next').onclick = nextWeek;
  }

  function openBoxes(k) {
    var got = zeroInv();
    for (var i = 0; i < k; i++) { var id = drawOne(); got[id]++; G.inv[id]++; }
    G.opened += k; G.hid += got.hidden;
    return got;
  }
  function buySecondary(k) {
    var bp = boxPrice(G.S, G.week); k = Math.min(k, Math.floor(G.cash / bp)); if (k <= 0) return;
    G.cash -= k * bp; G.spent += k * bp; G.bought[G.week] += k * bp;
    var got = openBoxes(k); showGot('买了 ' + k + ' 个未拆盲盒，花了 ' + fmt(k * bp), got);
  }
  function buyOfficialW0(k) {
    k = Math.min(k, W0_LIMIT - G.offW0, Math.floor(G.cash / OFFICIAL)); if (k <= 0) return;
    G.offW0 += k; G.cash -= k * OFFICIAL; G.spent += k * OFFICIAL; G.bought[0] += k * OFFICIAL;
    var got = openBoxes(k); showGot('按原价买了 ' + k + ' 个，花了 ' + fmt(k * OFFICIAL), got);
  }
  function preorder(k) {
    var os = officialState(); if (os.kind !== 'pre') return;
    k = Math.min(k, os.left, Math.floor(G.cash / OFFICIAL)); if (k <= 0) return;
    G.preThis += k; G.cash -= k * OFFICIAL; G.spent += k * OFFICIAL; G.bought[G.week] += k * OFFICIAL;
    G.pre.push({ arrive: os.arrive, qty: k });
    toast('预售下单 ' + k + ' 个，第 ' + os.arrive + ' 周到货');
    screenWeek();
  }
  function sell(id, k) {
    k = Math.min(k, G.inv[id]); if (k <= 0) return;
    var d = DESIGNS.filter(function (x) { return x.id === id; })[0];
    var get = k * priceOf(G.S, G.week, d) * (1 - FEE);
    G.inv[id] -= k; G.cash += get; G.revenue += get; G.sold[G.week] += get;
    toast('卖出 ' + k + ' 个' + d.name + '，到手 ' + fmt(get));
    screenWeek();
  }
  function sellAll() {
    var total = 0, n = 0;
    DESIGNS.forEach(function (d) {
      var k = G.inv[d.id]; if (!k) return;
      var get = k * priceOf(G.S, G.week, d) * (1 - FEE);
      G.inv[d.id] = 0; G.cash += get; G.revenue += get; G.sold[G.week] += get; total += get; n += k;
    });
    if (n) toast('全部卖掉 ' + n + ' 个，到手 ' + fmt(total)); else toast('手上没有货');
    screenWeek();
  }
  function nextWeek() {
    if (G.week >= LAST) { finish(); return; }
    G.week++; G.preThis = 0; G.arrivals = null;
    var arrivedQty = 0, got = zeroInv();
    G.pre = G.pre.filter(function (p) {
      if (p.arrive === G.week) { arrivedQty += p.qty; var g = openBoxes(p.qty); DESIGNS.forEach(function (d) { got[d.id] += g[d.id]; }); return false; }
      return true;
    });
    if (arrivedQty) G.arrivals = arrivedQty;
    screenWeek(); scrollTop();
    if (arrivedQty) showGot('预售到货 ' + arrivedQty + ' 个，开盒结果', got);
  }

  function showGot(title, got) {

      return '<div class="g' + (d.tier === 'h' ? ' h' : '') + '"><img src="' + ICON[d.id] + '" alt=""><b>×' + got[d.id] + '</b>' + d.name + '</div>';
    }).join('');

  }
  function screenWeekSilently() { if ($('app').querySelector('.plist')) { var y = window.scrollY; screenWeek(); window.scrollTo(0, y); } }
  function closeLayer() { $('layer').innerHTML = ''; }
  function showRules() {

      '<li><b>买</b>：发售日官方 99 元，每人限购 12 个；二手平台上随时能按当周市价买未拆的盲盒；官方补货后可以按 99 元预售，3 周后到货，每周最多 72 个。</li>' +

  /* ---------- charts ---------- */
  function lineChart(upto, marks) {
    var S = G.S, W = 448, H = 170, l = 40, r = 10, t = 14, b = 26, pw = W - l - r, ph = H - t - b;
    var vals = []; for (var i = 0; i <= LAST; i++) vals.push(boxPrice(S, i));
    var vmax = OFFICIAL; for (i = 0; i <= upto; i++) vmax = Math.max(vmax, vals[i]);
    var ymax = Math.ceil(vmax * 1.15 / 200) * 200;
    function X(w) { return l + pw * w / LAST; }
    function Y(v) { return t + ph - ph * v / ymax; }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="未拆盲盒价格走势">';
    for (var v = 0; v <= ymax; v += 200) {
      s += '<line x1="' + l + '" y1="' + Y(v) + '" x2="' + (W - r) + '" y2="' + Y(v) + '" stroke="#E7E7ED"/>';
      s += '<text x="' + (l - 6) + '" y="' + (Y(v) + 4) + '" font-size="10" fill="#6F6F7A" text-anchor="end">' + v + '</text>';
    }
    for (i = 0; i <= LAST; i++) s += '<text x="' + X(i) + '" y="' + (H - 8) + '" font-size="10" fill="' + (i <= upto ? '#6F6F7A' : '#C9C9D3') + '" text-anchor="middle">' + i + '</text>';
    s += '<line x1="' + l + '" y1="' + Y(OFFICIAL) + '" x2="' + (W - r) + '" y2="' + Y(OFFICIAL) + '" stroke="#6F6F7A" stroke-width="1.4" stroke-dasharray="5 4"/>';
    var pts = []; for (i = 0; i <= upto; i++) pts.push(X(i).toFixed(1) + ',' + Y(vals[i]).toFixed(1));
    s += '<polyline fill="none" stroke="#D54CA9" stroke-width="2.4" stroke-linejoin="round" points="' + pts.join(' ') + '"/>';
    for (i = 0; i <= upto; i++) s += '<circle cx="' + X(i) + '" cy="' + Y(vals[i]) + '" r="' + (i === upto ? 5 : 3.5) + '" fill="#D54CA9" stroke="#fff" stroke-width="2"/>';
    s += '<text x="' + X(upto) + '" y="' + (Y(vals[upto]) - 10) + '" font-size="11" font-weight="700" fill="#141414" text-anchor="' + (upto > 8 ? 'end' : 'middle') + '">' + fmt(vals[upto]) + '</text>';
    if (marks) {
      var mx = 0; for (i = 0; i <= LAST; i++) mx = Math.max(mx, marks[i]);
      for (i = 0; i <= LAST; i++) if (marks[i] > 0) {
        var rr = 4 + 8 * Math.sqrt(marks[i] / mx);
        s += '<circle cx="' + X(i) + '" cy="' + Y(vals[i]) + '" r="' + rr.toFixed(1) + '" fill="rgba(246,160,60,.35)" stroke="#F6A03C" stroke-width="1.5"/>';
      }
    }
    return s + '</svg>';
  }
  function barChart(labels, values, fmtv, W, H) {
    W = W || 448; H = H || 170;
    var l = 8, r = 8, t = 20, b = 26, pw = W - l - r, ph = H - t - b, n = values.length, gap = 10;
    var bw = (pw - gap * (n - 1)) / n, vmax = Math.max.apply(null, values.concat([1e-9]));
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%">';
    s += '<line x1="' + l + '" y1="' + (t + ph) + '" x2="' + (W - r) + '" y2="' + (t + ph) + '" stroke="#C9C9D3"/>';
    for (var i = 0; i < n; i++) {
      var x = l + i * (bw + gap), hgt = ph * values[i] / vmax, y = t + ph - hgt, rr = Math.min(4, hgt);
      s += '<path d="M' + x + ',' + (t + ph) + ' V' + (y + rr) + ' Q' + x + ',' + y + ' ' + (x + rr) + ',' + y + ' H' + (x + bw - rr) + ' Q' + (x + bw) + ',' + y + ' ' + (x + bw) + ',' + (y + rr) + ' V' + (t + ph) + ' Z" fill="#D54CA9"/>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (y - 5) + '" font-size="10.5" font-weight="700" fill="#141414" text-anchor="middle">' + fmtv(values[i]) + '</text>';
      s += '<text x="' + (x + bw / 2) + '" y="' + (H - 8) + '" font-size="10" fill="#6F6F7A" text-anchor="middle">' + labels[i] + '</text>';
    }
    return s + '</svg>';
  }

  /* ---------- results ---------- */
  function benchmarks() {
    var S = G.S, P = S.peak, R = S.restock;
    var ev = function (w) { return boxPrice(S, w); };
    var k = Math.floor(10000 / ev(P));
    return [
      ['发售日按原价买 12 个，第 ' + P + ' 周（最热那周）全卖', 12 * 0.95 * ev(P) - 12 * OFFICIAL],
      ['发售日按原价买 12 个，一直拿到第 10 周', 12 * 0.95 * ev(LAST) - 12 * OFFICIAL],
      ['第 ' + P + ' 周花约 1 万元追高买未拆盲盒，拿到第 10 周', k * 0.95 * ev(LAST) - k * ev(P)],
      ['同样追高，但第 ' + R + ' 周补货消息一出就止损', k * 0.95 * ev(R) - k * ev(P)]
    ];
  }
  function finish() {
    var w = LAST, liq = 0;
    DESIGNS.forEach(function (d) { liq += G.inv[d.id] * priceOf(G.S, w, d) * (1 - FEE); });
    G.liq = liq; G.final = G.cash + liq; G.profit = G.final - START;
    screenEnd();
  }
  function screenEnd() {
    setTop(''); setFoot('');
    var up = G.profit >= 0, exp = G.opened / 72;
    var bench = benchmarks().map(function (b, i) {
      var c = ['#F6A03C', '#F2606F', '#D54CA9', '#9B52EF'][i];
      return '<div class="bench"><div class="n" style="background:' + c + '">' + (i + 1) + '</div><div>' + b[0] + '</div><div class="r ' + (b[1] >= 0 ? 'pos' : 'neg') + '">' + (b[1] >= 0 ? '+' : '') + fmt(b[1]) + '</div></div>';
    }).join('');
    var warm = G.warm && G.warm.done ? '<div class="kv"><span>热身时开 72 个，开出隐藏款</span><b>' + G.warm.got + ' 个</b></div>' : '';
    $('app').innerHTML =
      '<div class="eyebrow">结算 · ' + (G.mode === 'class' ? '课堂剧本' : '随机剧本') + '</div>' +
      '<h1 style="font-size:22px">你最后' + (up ? '赚了' : '亏了') + '</h1>' +
      '<div class="big ' + (up ? 'up' : 'down') + '">' + (up ? '+' : '') + fmt(G.profit) + '</div>' +
      '<p class="muted">本金 ' + fmt(START) + ' → 最后 ' + fmt(G.final) + '（' + pct(G.profit / START) + '）</p>' +
      '<div class="card"><div class="kv"><span>买盒一共花了</span><b>' + fmt(G.spent) + '</b></div>' +
      '<div class="kv"><span>卖货到手（已扣 5%）</span><b>' + fmt(G.revenue) + '</b></div>' +
      '<div class="kv"><span>第 10 周清仓到手</span><b>' + fmt(G.liq) + '</b></div>' +
      '<div class="kv"><span>一共开盒</span><b>' + G.opened + ' 个</b></div>' +
      '<div class="kv"><span>开出隐藏款</span><b>' + G.hid + ' 个（平均应该 ' + exp.toFixed(1) + ' 个）</b></div>' + warm + '</div>' +
      '<div class="sec"><h3>你在哪几周卖的货</h3><span>橙色圆圈越大，卖得越多</span></div><div class="chartbox">' + lineChart(LAST, G.sold) + '</div>' +
      '<div class="legend"><span><i></i>未拆盲盒（二手）</span><span><i class="d"></i>官方价 99 元</span></div>' +
      '<div class="sec"><h3>换几种做法，平均会怎样</h3><span>按期望值算</span></div><div class="card" style="margin-top:6px">' + bench + '</div>' +
      '<div class="row2"><button class="btn grad block" id="toPano">看全景图：卖家都在亏钱吗？</button>' +
      '<button class="btn alt" id="again" style="flex:1">再玩一次</button><button class="btn alt" id="rand" style="flex:1">随机剧本</button></div>';
    $('toPano').onclick = screenPano;
    $('again').onclick = function () { var m = G.mode; newGame(m); G.warm = { done: true, got: G.warm ? G.warm.got : null }; screenWeek(); scrollTop(); };
    $('rand').onclick = function () { newGame('random'); G.warm = { done: true, got: null }; screenWeek(); scrollTop(); };
    scrollTop();
  }

  function simHist() {
    var c = [0, 0, 0, 0, 0];
    for (var i = 0; i < 10000; i++) {
      var h = 0; for (var j = 0; j < 72; j++) if (rnd() < P_HID) h++;
      c[Math.min(h, 4)]++;
    }
    return c.map(function (x) { return x / 100; });
  }
  function simSellers() {
    var S = G.S, R = S.restock, by = [], cnt = [], lossAll = 0, N = 10000;
    for (var e = 0; e <= 6; e++) { by.push(0); cnt.push(0); }
    for (var i = 0; i < N; i++) {
      var e2 = Math.floor(rnd() * 7), cost, arrive;
      if (e2 === 0 && rnd() < 0.3) { cost = 12 * OFFICIAL; arrive = 0; }
      else if (e2 >= R && e2 + PRE_DELAY <= LAST && rnd() < 0.5) { cost = 12 * OFFICIAL; arrive = e2 + PRE_DELAY; }
      else { cost = 12 * boxPrice(S, e2); arrive = e2; }
      var ex = arrive + Math.floor(rnd() * (LAST - arrive + 1)), get = 0;
      for (var k = 0; k < 12; k++) {
        var id = drawOne(), d = DESIGNS.filter(function (x) { return x.id === id; })[0];
        get += priceOf(S, ex, d) * (1 - FEE);
      }
      cnt[e2]++; if (get < cost) { by[e2]++; lossAll++; }
    }
    return { rate: by.map(function (x, j) { return 100 * x / cnt[j]; }), all: 100 * lossAll / N };
  }
  function screenPano() {
    var hist = simHist(), sel = simSellers();
    $('app').innerHTML =
      '<div class="eyebrow">全景图</div><h1 style="font-size:22px">卖家都在亏钱吗？</h1>' +
      '<div class="card white"><h2 style="font-size:15px">1 万个人各开 72 个盲盒</h2>' +
      '<p class="muted" style="margin-top:2px">开出 0 个、1 个、2 个……隐藏款的人各占多少（电脑现场模拟）</p>' +
      barChart(['0 个', '1 个', '2 个', '3 个', '4 个+'], hist, function (v) { return v.toFixed(1) + '%'; }) +
      '<p style="margin-top:6px;font-size:14px">这次模拟里，<b>' + hist[0].toFixed(1) + '%</b> 的人开 72 个，一个隐藏款都没开出来。</p></div>' +
      '<div class="card white"><h2 style="font-size:15px">1 万个卖家，按进场时间分组</h2>' +
      '<p class="muted" style="margin-top:2px">每人买 12 个，进场的周、买货渠道、卖出的周都随机，看每组里亏钱的人占多少</p>' +
      barChart(['第0周', '第1周', '第2周', '第3周', '第4周', '第5周', '第6周'], sel.rate, function (v) { return Math.round(v) + '%'; }) +
      '<p style="margin-top:6px;font-size:14px">整体大约 <b>' + Math.round(sel.all) + '%</b> 的模拟卖家亏钱。</p>' +
      '<p class="muted" style="margin-top:4px">这是按我们这个游戏的规则模拟出来的，用来看“什么时候进场最要命”，不是真实统计。</p></div>' +
      '<div class="row2"><button class="btn alt" id="back" style="flex:1">回到结算</button><button class="btn grad" id="rand2" style="flex:1">随机剧本再玩</button></div>';
    $('back').onclick = screenEnd;
    $('rand2').onclick = function () { newGame('random'); G.warm = { done: true, got: null }; screenWeek(); scrollTop(); };
    scrollTop();
  }

  window.__game = { get: function () { return G; }, newGame: newGame, screenWeek: screenWeek, nextWeek: nextWeek, sellAll: sellAll, buySecondary: buySecondary, buyOfficialW0: buyOfficialW0, preorder: preorder, finish: finish, boxPrice: function (w) { return boxPrice(G.S, w); }, makeRandom: makeRandom, CLASS: CLASS };
  screenStart();
})();
</script>
</body>
</html>
